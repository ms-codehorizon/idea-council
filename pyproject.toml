[project]
name = "idea-council"
version = "0.1.0"
description = "Multi-provider LLM debate council for early product ideation"
readme = "README.md"
authors = [
    { name = "ms-codehorizon", email = "263735383+ms-codehorizon@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.75.0",
    "tavily-python>=0.5.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
idea-council = "idea_council.cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_council"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.coverage.run]
source = ["idea_council"]
omit = [
    "src/idea_council/providers/adapter.py",
    "src/idea_council/providers/registry.py",
    "src/idea_council/orchestrator/market.py",
    "src/idea_council/config/settings.py",
    "src/idea_council/cli/cli.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
